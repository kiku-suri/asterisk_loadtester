<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<link rel="stylesheet" href="/css/app.css">
<title>Add Load Generator</title>
</head>
<div class="container">
<body>
<div th:replace="~{fragments/layout :: header}"></div>

<form action="/generators"
      method="post">

    <label>Server Name</label>
    <input type="text"
           name="serverName">

    <br><br>

    <label>IP Address</label>
    <input type="text"
           name="ipAddress">

    <br><br>

    <label>SSH Port</label>
    <input type="number"
           name="sshPort"
           value="22">

    <br><br>

    <label>SSH Username</label>
    <input type="text"
           name="sshUsername">

    <br><br>

    <label>SSH Password</label>
    <input type="password"
           name="sshPassword">

    <br><br>

    <label>Max Calls</label>
    <input type="number"
           name="maxCalls">

    <br><br>

    <button type="submit">
        Save
    </button>

</form>

</body>
</div>
</html>
