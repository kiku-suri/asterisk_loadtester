<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Load Tester Login</title>

    <style>

        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
        }

        .error {
            color: red;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Asterisk Load Testing Platform</h2>

    <form method="post"
          action="/authenticate">

        <input
                type="text"
                name="username"
                placeholder="Username"
                required>

        <input
                type="password"
                name="password"
                placeholder="Password"
                required>

        <button type="submit">
            Login
        </button>

    </form>

    <p class="error"
       th:text="${error}">
    </p>

</div>

</body>
</html>
