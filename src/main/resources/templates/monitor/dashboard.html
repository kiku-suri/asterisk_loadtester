<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Campaign Monitor</title>
    <link rel="stylesheet" href="/css/app.css">
    <meta http-equiv="refresh" content="10">
</head>

<body>

<div th:replace="~{fragments/layout :: header}"></div>

<div class="container">

    <div class="page-header-row">
        <h2 class="page-title">Campaign Monitor</h2>

        <div>
            <a class="btn btn-secondary" href="/monitor">Back</a>
            <a class="btn"
               th:href="@{/monitor/{id}/collect-metrics(id=${campaign.campaignId})}">
                Collect DUT Metrics
            </a>
        </div>
    </div>

    <div class="card-row">
        <div class="card">
            <div class="card-title">Campaign</div>
            <div class="card-value" th:text="${campaign.campaignName}">-</div>
        </div>

        <div class="card">
            <div class="card-title">Status</div>
            <div class="card-value" th:text="${monitor.status}">-</div>
        </div>

        <div class="card">
            <div class="card-title">PID</div>
            <div class="card-value" th:text="${monitor.pid}">-</div>
        </div>

        <div class="card">
            <div class="card-title">CPS</div>
            <div class="card-value" th:text="${monitor.cps}">0</div>
        </div>
    </div>

    <h3 class="section-title">Call Status</h3>

    <div class="card-row">
        <div class="card">
            <div class="card-title">Active Calls</div>
            <div class="card-value" th:text="${monitor.activeCalls}">0</div>
        </div>

        <div class="card">
            <div class="card-title">Successful Calls</div>
            <div class="card-value" th:text="${monitor.successfulCalls}">0</div>
        </div>

        <div class="card">
            <div class="card-title">Failed Calls</div>
            <div class="card-value" th:text="${monitor.failedCalls}">0</div>
        </div>
    </div>

    <h3 class="section-title">DUT System Metrics</h3>

    <div class="table-wrapper">
        <table>
            <tr>
                <th>Collected At</th>
                <th>CPU %</th>
                <th>Memory %</th>
                <th>Load Avg</th>
                <th>Active Calls</th>
            </tr>

            <tr th:each="m : ${metrics}">
                <td th:text="${m.collectedAt}"></td>
                <td th:text="${m.cpuUsage}"></td>
                <td th:text="${m.memoryUsage}"></td>
                <td th:text="${m.loadAverage}"></td>
                <td th:text="${m.activeCalls}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(metrics)}">
                <td colspan="5">No DUT metrics collected yet.</td>
            </tr>
        </table>
    </div>

</div>

</body>
</html>
