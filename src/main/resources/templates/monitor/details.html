<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" href="/css/app.css">
<title>Campaign Details</title>

<meta http-equiv="refresh" content="5"/>

</head>

<div class="container">

<body>
<div th:replace="~{fragments/layout :: header}"></div>


<p>
Campaign :
<span th:text="${campaign.campaignName}"></span>
</p>

<p>
Status :
<span th:text="${campaign.status}"></span>
</p>

<p>
PID :
<span th:text="${campaign.sippPid}"></span>
</p>

<p>
Start :
<span th:text="${campaign.startTime}"></span>
</p>

<p>
End :
<span th:text="${campaign.endTime}"></span>
</p>

<p>
Result File :
<span th:text="${campaign.resultFile}"></span>
</p>

</body>
</div>
</html>
