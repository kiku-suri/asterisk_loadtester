<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" href="/css/app.css">
<title>Upload Scenario</title>
</head>

<div class="container">

<body>

<div th:replace="~{fragments/layout :: header}"></div>

<form
        method="post"
        enctype="multipart/form-data">

    <label>Name</label>
    <input type="text"
           name="scenarioName"/>

    <br/><br/>

    <label>Description</label>
    <input type="text"
           name="description"/>

    <br/><br/>

    <label>XML File</label>
    <input type="file"
           name="file"/>

    <br/><br/>

    <button type="submit">
        Upload
    </button>

</form>

<br/>

</body>
</div>
</html>
