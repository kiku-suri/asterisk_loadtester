<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link rel="stylesheet" href="/css/app.css">
    <title>Dashboard</title>
</head>

<body>

<div class="header">
    <h2>Asterisk Load Testing Platform</h2>
</div>

<div class="nav">
    <a href="/dashboard">Home</a>
    <a href="/duts">DUT Servers</a>
    <a href="/generators">Load Generators</a>
    <a href="/test-configs">Test Configurations</a>
    <a href="/scenarios">Scenarios</a>
    <a href="/campaigns">Campaigns</a>
    <a href="/monitor">Monitor</a>
    <a href="/users">Users</a>
    <a href="/logout">Logout</a>
</div>

<div class="container">

    <h3>Quick Actions</h3>

    <a class="btn" href="/duts/new">
        Add DUT
    </a>

    <a class="btn" href="/generators/new">
        Add Generator
    </a>

    <a class="btn" href="/scenarios/new">
        Upload Scenario
    </a>

    <a class="btn" href="/test-configs/new">
        Create Config
    </a>

    <a class="btn" href="/campaigns/new">
        Create Campaign
    </a>

</div>

<h3>Campaign Status</h3>

<table border="1">

<tr>
<th>ID</th>
<th>Name</th>
<th>Status</th>
</tr>

<tr th:each="c : ${campaigns}">
<td th:text="${c.campaignId}"></td>
<td th:text="${c.campaignName}"></td>
<td th:text="${c.status}"></td>
</tr>

</table>

<hr>

<table border="1">

<tr>
    <td>Total DUTs</td>
    <td th:text="${totalDuts}"></td>
</tr>

<tr>
    <td>Total Generators</td>
    <td th:text="${totalGenerators}"></td>
</tr>

<tr>
    <td>Active Tests</td>
    <td th:text="${activeTests}"></td>
</tr>

<tr>
    <td>Running Calls</td>
    <td th:text="${runningCalls}"></td>
</tr>

</table>



</body>
</html>
