<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Campaign Statistics</title>
    <link rel="stylesheet" href="/css/app.css">
</head>

<div class="container">

<body>
<div th:replace="~{fragments/layout :: header}"></div>


<div class="container">

    <h2 class="page-title">Campaign Statistics</h2>

    <a class="btn btn-secondary" href="/campaigns">Back to Campaigns</a>

    <div class="card-row" th:if="${!#lists.isEmpty(stats)}">
        <div class="card">
            <div class="card-title">Total Calls</div>
            <div class="card-value" th:text="${stats[0].totalCalls}">0</div>
        </div>

        <div class="card">
            <div class="card-title">Successful Calls</div>
            <div class="card-value" th:text="${stats[0].successfulCalls}">0</div>
        </div>

        <div class="card">
            <div class="card-title">Failed Calls</div>
            <div class="card-value" th:text="${stats[0].failedCalls}">0</div>
        </div>

        <div class="card">
            <div class="card-title">CPS</div>
            <div class="card-value" th:text="${stats[0].cps}">0</div>
        </div>
    </div>

    <h3 class="section-title">Summary History</h3>

    <div class="table-wrapper">
    <table>
        <tr>
            <th>Total</th>
            <th>Success</th>
            <th>Failed</th>
            <th>CPS</th>
        </tr>

        <tr th:each="s : ${stats}">
            <td th:text="${s.totalCalls}"></td>
            <td class="status-success" th:text="${s.successfulCalls}"></td>
            <td class="status-failed" th:text="${s.failedCalls}"></td>
            <td th:text="${s.cps}"></td>
        </tr>
    </table>
</div>

    <h3 class="section-title">Call Records</h3>

    <div class="table-wrapper">
    <table>
        <tr>
            <th>ID</th>
            <th>Response</th>
            <th>Result</th>
        </tr>

        <tr th:each="c : ${calls}">
            <td th:text="${c.recordId}"></td>
            <td th:text="${c.responseCode}"></td>
            <td th:classappend="${c.callResult == 'SUCCESS'} ? 'status-success' : 'status-failed'"
                th:text="${c.callResult}">
            </td>
        </tr>
    </table>
</div>

</div>

</body>
</div>
</html>
