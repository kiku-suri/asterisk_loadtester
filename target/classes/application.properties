######################################################
# APPLICATION
######################################################

spring.application.name=asterisk-loadtester

server.port=8080

######################################################
# DATABASE
######################################################

spring.datasource.url=jdbc:mysql://localhost:3306/asterisk_loadtest

spring.datasource.username=loadtester

spring.datasource.password=LoadTest@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

######################################################
# JPA
######################################################

#spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

######################################################
# THYMELEAF
######################################################

spring.thymeleaf.cache=false

######################################################
# FILE UPLOAD
######################################################

spring.servlet.multipart.max-file-size=50MB

spring.servlet.multipart.max-request-size=50MB

spring.jpa.hibernate.ddl-auto=update

######################################################
# LOGGING
######################################################

logging.level.root=INFO

logging.level.com.telecom.loadtester=DEBUG

logging.file.name=/opt/loadtester/logs/application/loadtester.log

######################################################
# CUSTOM PATHS
######################################################

loadtester.reports.path=/opt/loadtester/reports

loadtester.scenarios.path=/opt/loadtester/uploads/scenarios

loadtester.runtime.path=/opt/loadtester/runtime

loadtester.backup.path=/opt/loadtester/backups

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=TRACE
######################################################
# SSH
######################################################

loadtester.ssh.timeout=30000

######################################################
# METRICS
######################################################

loadtester.metrics.poll.interval=10000

#######################################################
## SIPp
######################################################
loadtester.scenario.storage=/opt/loadtester/scenarios
