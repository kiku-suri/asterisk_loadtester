<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
<link rel="stylesheet" href="/css/app.css">
<div class="nav">
    <a href="/dashboard">Home</a>
    <a href="/duts">DUT Servers</a>
    <a href="/generators">Load Generators</a>
    <a href="/test-configs">Test Configurations</a>
    <a href="/scenarios">Scenarios</a>
    <a href="/campaigns">Campaigns</a>
    <a href="/monitor">Monitor</a>
    <a href="/users">Users</a>
    <a href="/logout">Logout</a>
</div>


<hr>

<h2>Create Campaign</h2>

<form action="/campaigns"
      method="post">

<label>Campaign Name</label>
<br>

<input type="text"
       name="campaignName"
       required>

<br><br>

<label>DUT Server</label>
<br>

<select name="dutServer">

<option th:each="d : ${duts}"
        th:value="${d.dutId}"
        th:text="${d.serverName}">
</option>

</select>

<br><br>

<label>Load Generator</label>
<br>

<select name="loadGenerator">

<option th:each="g : ${generators}"
        th:value="${g.generatorId}"
        th:text="${g.serverName}">
</option>

</select>

<br><br>

<label>Test Configuration</label>
<br>

<select name="testConfiguration">

<option th:each="c : ${configs}"
        th:value="${c.testConfigId}"
        th:text="${c.testName}">
</option>

</select>

<br><br>

<button type="submit">
Save Campaign
</button>

</form>

</body>
</html>
