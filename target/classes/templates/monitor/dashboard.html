<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<link rel="stylesheet" href="/css/app.css">
<title>Campaign Monitor</title>

<meta http-equiv="refresh" content="5">

</head>

<body>

<div class="header">
<h2>Campaign Monitor</h2>
</div>

<div class="nav">
    <a href="/dashboard">Home</a>
    <a href="/duts">DUT Servers</a>
    <a href="/generators">Load Generators</a>
    <a href="/test-configs">Test Configurations</a>
    <a href="/scenarios">Scenarios</a>
    <a href="/campaigns">Campaigns</a>
    <a href="/monitor">Monitor</a>
    <a href="/users">Users</a>
    <a href="/logout">Logout</a>
</div>

<a href="/campaigns">Back</a>

<hr>

<table border="1">

<tr>
    <td>Campaign</td>
    <td th:text="${campaign.campaignName}"></td>
</tr>

<tr>
    <td>Status</td>
    <td th:text="${monitor.status}"></td>
</tr>

<tr>
    <td>PID</td>
    <td th:text="${monitor.pid}"></td>
</tr>

<tr>
    <td>Active Calls</td>
    <td th:text="${monitor.activeCalls}"></td>
</tr>

<tr>
    <td>Successful Calls</td>
    <td th:text="${monitor.successfulCalls}"></td>
</tr>

<tr>
    <td>Failed Calls</td>
    <td th:text="${monitor.failedCalls}"></td>
</tr>

<tr>
    <td>CPS</td>
    <td th:text="${monitor.cps}"></td>
</tr>

</table>

</body>
</html>
