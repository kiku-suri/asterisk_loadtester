<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<link rel="stylesheet" href="/css/app.css">
<title>Add Load Generator</title>
</head>

<body>
<div class="header">
<h2>Add Load Generator</h2>
</div>

<div class="nav">
    <a href="/dashboard">Home</a>
    <a href="/duts">DUT Servers</a>
    <a href="/generators">Load Generators</a>
    <a href="/test-configs">Test Configurations</a>
    <a href="/scenarios">Scenarios</a>
    <a href="/campaigns">Campaigns</a>
    <a href="/monitor">Monitor</a>
    <a href="/users">Users</a>
    <a href="/logout">Logout</a>
</div>

<hr>
<form action="/generators"
      method="post">

    <label>Server Name</label>
    <input type="text"
           name="serverName">

    <br><br>

    <label>IP Address</label>
    <input type="text"
           name="ipAddress">

    <br><br>

    <label>SSH Port</label>
    <input type="number"
           name="sshPort"
           value="22">

    <br><br>

    <label>SSH Username</label>
    <input type="text"
           name="sshUsername">

    <br><br>

    <label>SSH Password</label>
    <input type="password"
           name="sshPassword">

    <br><br>

    <label>Max Calls</label>
    <input type="number"
           name="maxCalls">

    <br><br>

    <button type="submit">
        Save
    </button>

</form>

</body>
</html>
