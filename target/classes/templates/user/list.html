<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Users</title>
</head>

<body>

<div>
    <a href="/dashboard">Home</a> |
    <a href="/duts">DUT Servers</a> |
    <a href="/generators">Load Generators</a> |
    <a href="/test-configs">Test Configurations</a> |
    <a href="/users">Users</a> |
    <a href="/logout">Logout</a>
</div>

<hr>

<h2>User Management</h2>

<table border="1">

<tr>
    <th>ID</th>
    <th>Username</th>
    <th>Role</th>
    <th>Enabled</th>
</tr>

<tr th:each="u : ${users}">
    <td th:text="${u.userId}"></td>
    <td th:text="${u.username}"></td>
    <td th:text="${u.role}"></td>
    <td th:text="${u.enabled}"></td>
</tr>

</table>

</body>
</html>
